<text x="589" y="157" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">★</text>
<text x="621" y="158" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#9f1239" text-anchor="start">2  Chaincode policy enforcer</text>
<text x="581" y="216" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="normal" fill="#334155" text-anchor="start">The ledger enforces the approval</text>
<text x="581" y="246" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="normal" fill="#334155" text-anchor="start">quorum itself instead of only</text>
<text x="581" y="276" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="normal" fill="#334155" text-anchor="start">recording what happened.</text>
