<rect x="40" y="355" width="495" height="220" rx="16" fill="#fff1f2" stroke="#be123c" stroke-width="2.5"/>
</g>
<circle cx="76" cy="395" r="20" fill="#be123c"/>
<text x="76" y="402" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">★</text>
<text x="108" y="403" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#9f1239" text-anchor="start">4  Monotonic AI risk</text>
<text x="68" y="461" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="normal" fill="#334155" text-anchor="start">AI can raise a score, never lower it</text>
<text x="68" y="491" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="normal" fill="#334155" text-anchor="start">below the rule floor. It sees only</text>
<text x="68" y="521" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="normal" fill="#334155" text-anchor="start">sanitized diffs: anti prompt-injection.</text>
<g filter="url(#sh)">
<rect x="553" y="355" width="495" height="220" rx="16" fill="#fff1f2" stroke="#be123c" stroke-width="2.5"/>
</g>
<circle cx="589" cy="395" r="20" fill="#be123c"/>
<text x="589" y="402" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">★</text>
<text x="621" y="403" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#9f1239" text-anchor="start">5  Collusion guard</text>
<text x="581" y="461" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="normal" fill="#334155" text-anchor="start">Detects self-approval and repeated</text>
<text x="581" y="491" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="normal" fill="#334155" text-anchor="start">author-approver pairs using</text>
<text x="581" y="521" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="normal" fill="#334155" text-anchor="start">history held on the ledger.</text>
<g filter="url(#sh)">
<rect x="1066" y="355" width="495" height="220" rx="16" fill="#fff1f2" stroke="#be123c" stroke-width="2.5"/>
</g>
<circle cx="1102" cy="395" r="20" fill="#be123c"/>
<text x="1102" y="402" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">★</text>
<text x="1134" y="403" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#9f1239" text-anchor="start">6  Causal receipt</text>
<text x="1094" y="461" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="normal" fill="#334155" text-anchor="start">One verifiable chain: commit, plan,</text>
<text x="1094" y="491" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="normal" fill="#334155" text-anchor="start">approval, token, CloudTrail event,</text>
<text x="1094" y="521" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="normal" fill="#334155" text-anchor="start">drift check, ledger anchor.</text>
