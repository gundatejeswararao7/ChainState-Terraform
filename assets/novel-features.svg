<rect x="1066" y="110" width="495" height="220" rx="16" fill="#fff1f2" stroke="#be123c" stroke-width="2.5"/>
</g>
<circle cx="1102" cy="150" r="20" fill="#be123c"/>
<text x="1102" y="157" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">★</text>
<text x="1134" y="158" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#9f1239" text-anchor="start">3  Merkle-anchored drift</text>
<text x="1094" y="216" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="normal" fill="#334155" text-anchor="start">Expected-state Merkle root lives</text>
<text x="1094" y="246" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="normal" fill="#334155" text-anchor="start">on-chain, so drift on one resource</text>
<text x="1094" y="276" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" font-size="15.5" font-weight="normal" fill="#334155" text-anchor="start">is provable without trusting the DB.</text>
